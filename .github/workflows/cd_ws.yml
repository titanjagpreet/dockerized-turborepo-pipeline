name: Deploy WebSocket Server

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ws-server/**'
      - 'packages/**'
      - 'docker/Dockerfile.ws'

jobs:

  deploy-ws:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push WS Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ws
          push: true
          tags: |
            titanxbt/turbo-ws:${{ github.sha }}
            titanxbt/turbo-ws:latest

      - name: Deploy WS Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull titanxbt/turbo-ws:${{ github.sha }}

            docker stop turbo-ws || true
            docker rm turbo-ws || true

            docker run -d \
              --name turbo-ws \
              --network turbo-net \
              -p 3003:3003 \
              -e DATABASE_URL="postgresql://postgres:mysecretpassword@postgres:5432/postgres?schema=public" \
              titanxbt/turbo-ws:${{ github.sha }}