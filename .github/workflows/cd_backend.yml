name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/http-server/**'
      - 'packages/**'
      - 'docker/Dockerfile.http'

jobs:

  deploy-backend:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.http
          push: true
          tags: |
            titanxbt/turbo-http:${{ github.sha }}
            titanxbt/turbo-http:latest

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull titanxbt/turbo-http:${{ github.sha }}

            docker stop turbo-http || true
            docker rm turbo-http || true

            docker run -d \
              --name turbo-http \
              --network turbo-net \
              -p 3001:3001 \
              -e DATABASE_URL="postgresql://postgres:mysecretpassword@postgres:5432/postgres?schema=public" \
              titanxbt/turbo-http:${{ github.sha }}