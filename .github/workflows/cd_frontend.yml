name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'docker/Dockerfile.web'

jobs:

  deploy-frontend:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            titanxbt/turbo-web:${{ github.sha }}
            titanxbt/turbo-web:latest

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull titanxbt/turbo-web:${{ github.sha }}

            docker stop turbo-web || true
            docker rm turbo-web || true

            docker run -d \
              --name turbo-web \
              --network turbo-net \
              -p 3000:3000 \
              -e DATABASE_URL="postgresql://postgres:mysecretpassword@postgres:5432/postgres?schema=public" \
              titanxbt/turbo-web:${{ github.sha }}